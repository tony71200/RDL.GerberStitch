; RDL.GerberStitch.Harness — AlignStitchConfig tuning file.
; Read by RDL.GerberStitch.Facade.AlignStitchConfigIniReader.ReadFromIni (same reader Master/Worker uses).
; Missing keys keep AlignStitchConfig defaults. Missing file -> harness runs with defaults (no error).
; Values below match the current AlignStitchConfig defaults; edit as needed.

[GerberAlignStitch]
StitchingEngine=HalconProjectiveMosaicRebased
EnableBlending=false
CalculateTimeDetail=true
NccMinScore=0.10
EccMinCorrelation=0.13
MaxTranslationPixels=300

; Geometry (Core DirectAlignmentOptions.Geometry)
MaxAbsRotationDeg=0.1

; Policy (Core DirectAlignmentOptions.Policy / DirectPipelinePolicy)
AllowCoarseOnlyAcceptance=true
AllowRefinementFromExpectedWhenCoarseFails=true

FallbackToLegacyMerge=false
